set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:RGB"

set -g mouse on
set -g history-limit 100000
set -g escape-time 10
set -g focus-events on
setw -g mode-keys vi

# clipboard: select copy command per OS (pbcopy > wl-copy > xclip, last wins)
set -g @copy_command "xclip -selection clipboard -in"
if-shell 'command -v wl-copy >/dev/null' 'set -g @copy_command "wl-copy"'
if-shell 'command -v pbcopy >/dev/null'  'set -g @copy_command "pbcopy"'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_command}"

bind -r l resize-pane -L 5
bind -r d resize-pane -D 5
bind -r u resize-pane -U 5
bind -r r resize-pane -R 5

bind | split-window -h
bind - split-window -v

bind v copy-mode

# status line: built-in formats only, no #(...), so redraws spawn no processes
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify "left"
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left-length 60
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#45475a,nobold]#[fg=#cdd6f4,bg=#45475a]  #h #[fg=#45475a,bg=#1e1e2e]"

set -g window-status-format "#[fg=#313244,bg=#1e1e2e]#[fg=#a6adc8,bg=#313244] #I #W #[fg=#313244,bg=#1e1e2e]"
set -g window-status-current-format "#[fg=#89b4fa,bg=#1e1e2e]#[fg=#1e1e2e,bg=#89b4fa,bold] #I #W #[fg=#89b4fa,bg=#1e1e2e]"
set -g window-status-separator " "

set -g status-right-length 80
set -g status-right "#{?client_prefix,#[fg=#fab387#,bg=#1e1e2e]#[fg=#1e1e2e#,bg=#fab387#,bold] PREFIX #[fg=#fab387#,bg=#1e1e2e] ,}#[fg=#45475a,bg=#1e1e2e]#[fg=#bac2de,bg=#45475a]  %Y-%m-%d #[fg=#cba6f7,bg=#45475a]#[fg=#1e1e2e,bg=#cba6f7,bold]  %H:%M "

set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#89b4fa,fg=#1e1e2e"
set -g message-command-style "bg=#45475a,fg=#89b4fa"
set -g mode-style "bg=#45475a,fg=#a6e3a1"

# load each plugin's *.tmux in the background, skipping tpm's blocking bootstrap
run-shell -b '~/.tmux/plugins/tmux-sensible/sensible.tmux'
run-shell -b '~/.tmux/plugins/tmux-copycat/copycat.tmux'
run-shell -b '~/.tmux/plugins/tmux-yank/yank.tmux'

# install/update plugins manually (prefix + I)
bind I run-shell -b '~/.tmux/plugins/tpm-redux/tpm'
